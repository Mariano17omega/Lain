[project]
name = "lain"
version = "0.1.0"
description = "Lain: QE Studio — desktop manager and plotter for Quantum ESPRESSO simulations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "ase>=3.23",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pymatgen>=2026.9.24",
]

[project.scripts]
lain = "qe_studio.__main__:main"
qe-studio-askpass = "qe_studio.core.sync.askpass:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "paramiko>=5.0.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qe_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = [
    "realdata: runs against user simulation folders listed in QE_STUDIO_REAL_DATA",
    "perf: performance budget checks",
]
addopts = "-m 'not realdata'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["qe_studio"]
known-local-folder = ["calc_dialog_helpers", "calc_helpers", "conftest", "ssh_server", "sync_helpers", "viewer_helpers"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
