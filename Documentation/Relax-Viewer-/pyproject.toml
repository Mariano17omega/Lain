[project]
name = "relax-viewer"
version = "0.1.0"
description = "Qt6 viewer for Quantum ESPRESSO relaxation progress."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "PySide6>=6.7",
]

[project.scripts]
relax-viewer = "relax_viewer.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
