# Lain: QE Studio configuration.
# Copy to config.yaml (git-ignored) and adjust. Lain looks for its config in:
#   1. --config PATH   2. $QE_STUDIO_CONFIG   3. ./config.yaml   4. config.yaml in the Lain checkout
#   (the repository an editable install runs from)   5. ~/.config/qe-studio/config.yaml

paths:
  # Local folder holding the simulation tree shown in the explorer.
  local_root: ~/qe_simulations
  # Matching folder on the cluster (POSIX path). Sync mirrors local_root/<sub> <- remote_root/<sub>.
  remote_root: /home/seu_usuario/qe_simulations
  # Where XCrySDen is installed: its folder (the one holding the `xcrysden` script) or the script
  # itself. Empty: "Abrir com XCrysDen" in the right-click menu stays disabled.
  # Reload with "Recarregar config.yaml".
  xcrysden_path: ""
  # Folder for Lain's data (interface state, instance lock). Relative to this file; empty: the
  # system's default places. Copying the folder of this file with it takes Lain's state along.
  # Changes apply when Lain restarts.
  # data: data
  data: ""

cluster:
  host: cluster.example.org
  port: 22
  user: seu_usuario
  # auth: key       -> uses key_path (non-interactive; passphrase keys need ssh-agent)
  # auth: password  -> reads the password from the environment variable named in password_env.
  #                    An inline `password:` is accepted but discouraged (stored in plain text).
  auth: key
  key_path: ~/.ssh/id_ed25519
  password_env: QE_STUDIO_SSH_PASSWORD
  connect_timeout: 10
  # Seconds between reachability probes (TCP only, no login).
  status_poll_seconds: 300

sync:
  # rsync --exclude patterns (rsync semantics: trailing "/" = directories only).
  exclude:
    - tmp/
    - "*.save/"
    - "*.amn"
    - "*.mmn"
    - "UNK*"
    - "*.unk*"
    - "*.wfc*"
    - "*.mix*"
    - "*.hub*"
    - "*.igk*"
    - core
    - "core.[0-9]*"
  rsync_binary: rsync
  ssh_binary: ssh
  # Before downloading, show the plan (new files, updates, sizes, large files) and wait for
  # "Baixar". false = transfer directly (automation); updates still ask file by file.
  # Sending to the cluster ("Enviar ao cluster") always shows its plan, whatever this says.
  confirm_plan: true
  # "Enviar ao cluster" only adds new files (one the cluster has is never changed). On top of
  # `exclude`, these never go up: figures and plot settings are local.
  push_exclude:
    - plots/
    - "*.plot"

plot:
  # Default energy window (eV, relative to the reference energy).
  energy_min: -5.0
  energy_max: 5.0
  # Zero the energy axis at E_F (false = absolute energies).
  shift_to_fermi: true
  # Figure size in inches (width, height); the preview keeps this aspect ratio.
  figure_size: [6.0, 4.5]
  line_width: 1.2
  band_colors:
    valence: "#2563eb"
    conduction: "#00d2ff"
  fermi_color: "#f43f5e"
  # Figure background (preview and exported files); text and axes switch to light on dark colors.
  background: "#ffffff"
  orbital_colors:
    s: "#fbbf24"
    p: "#06b6d4"
    d: "#a855f7"
    f: "#ec4899"
  # Default color of each element in the PDOS, by the species label of the output (as in the
  # input's ATOMIC_SPECIES). Add a line `Label: "#color"` for a new element; entries are added to
  # these and win over the same label. Quote labels YAML reads as booleans ("No"). Grouped by
  # species + orbital, the orbitals of an element are shades of its color.
  atomos_colors:
    Al: "#E41A1C"
    C:  "#377EB8"
    H:  "#4DAF4A"
    Hg: "#FF7F00"
    K:  "#984EA3"
    O:  "#228B22"
    Si: "#F781BF"
  export:
    # Any of: png, svg, pdf
    formats: [png, svg, pdf]
    # PNG resolution: 300 or 600
    dpi: 300

ui:
  # dark, light or system (follow the operating system's color scheme). The Tema button / Ctrl+T
  # in the app cycles them and remembers your last choice.
  theme: dark
  # Language of the interface: auto, pt_BR or en. auto follows the system (Portuguese for pt*,
  # English for anything else). It is applied when the program starts: after changing it, restart
  # Lain ("Recarregar config.yaml" only tells you so). The environment variables QE_STUDIO_LANGUAGE
  # and LAIN_LANGUAGE (auto, pt_BR or en) take precedence over this key; the first one wins.
  language: auto
  # Size of every font, from 0.8 to 1.6 (1.0 = default). Reload with "Recarregar config.yaml".
  font_scale: 1.0
  # Folder names/patterns hidden in the explorer.
  hidden_dirs: [tmp, "*.save"]
  # false: the folder tree lists only folders (the file grid always lists files too).
  # true: the tree lists the files as well. Reload with "Recarregar config.yaml".
  # The file icon in the tree's header (between "Recolher tudo" and "Atualizar") switches it while
  # the program runs; nothing is saved, and a reload goes back to the value written here.
  tree_show_files: false
  # F5 (Atualizar) keeps what it read from files whose size and modification time did not
  # change. true: reread every file on F5 (only needed if something rewrites files keeping both).
  paranoid_refresh: false
  # The Plot button (activity bar) brings an open plot to front and shows a folder plotted before
  # (settings or figures in its plots/) as it was, without saving again. For a folder never plotted:
  # true plots and saves it; false only opens the plot adjustments panel (press "Gerar Plot" there).
  # Reload with "Recarregar config.yaml".
  auto_generate_plot: true

jobs:
  # "Criar cálculo" writes SGE + Intel MPI .qsub scripts. Their cluster side (QE and MPI paths,
  # parallel environment, OMP_NUM_THREADS and the Intel MPI environment) is fixed in the script
  # templates, as in the reference scripts; only the defaults below are configured.
  # Default of the NP field (cores of the job).
  cores: 64
  # Default of the pools field (pw.x -nk). NP must be a multiple of it.
  nk: 4
  # Folder of the pseudopotentials on the cluster, written as pseudo_dir into every pw.x input
  # "Criar cálculo" generates (each folder is then self-contained). Unset: the SCF's pseudo_dir stays.
  # pseudo_dir: /home/me/pseudo
