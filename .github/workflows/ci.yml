name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runner speed varies: fewer Hypothesis examples, and no deadline (see tests/conftest.py).
  HYPOTHESIS_PROFILE: ci
  # rsync and ssh are the real binaries the sync tests drive; the libraries are what Qt's
  # offscreen platform needs to load (tests/conftest.py forces QT_QPA_PLATFORM=offscreen).
  SYSTEM_PACKAGES: >-
    rsync openssh-client libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not realdata and not perf"

  # Latency budgets (NFR §7) depend on the shared runner: reported, never blocking the merge.
  perf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m perf
