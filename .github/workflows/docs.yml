name: Docs

on:
  # Every push to the public main is a release (a new orphan snapshot GitHub cannot diff, so a
  # paths filter would skip it): the site is rebuilt from each one.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # The site is published only from the public repository; lain-dev has no Pages (deploy is
    # skipped with this job).
    if: github.repository == 'Mariano17omega/Lain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --only-group docs
      - run: uv run --only-group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
